# M5Core488 Network / Time / Web configuration

ssid=YOUR_WIFI_SSID
password=YOUR_WIFI_PASSWORD


# LCD display offset from UTC
timezone=UTC+09:00

# NTP servers
ntp1=pool.ntp.org
ntp2=time.google.com
ntp3=time.cloudflare.com

# 0 = boot only
# 24 = every 24 hours
ntp_resync_hours=24

# Web server
# 0 = disable web and turn Wi-Fi off after NTP
# 1 = keep Wi-Fi connected and enable web
web_enable=1
web_port=80
hostname=m5core488

# Boot behavior
# 0    = stay at mode selection
# 1-60 = automatically enter AR488 MODE after N seconds
# Recommended for unattended / remote installations: 5
auto_ar488_seconds=5
